spring.application.name=chefie
spring.datasource.url=jdbc:postgresql://localhost:5432/chefie
spring.datasource.username=chefie
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.web.error.include-message=always
chefie.admin.username=${CHEFIE_ADMIN_USERNAME}
chefie.admin.password=${CHEFIE_ADMIN_PASSWORD}
chefie.wifi.ssid=${CHEFIE_WIFI_SSID}
chefie.wifi.password=${CHEFIE_WIFI_PASSWORD}